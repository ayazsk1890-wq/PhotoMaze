<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pm-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pm-grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="pm-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.1" />
    </linearGradient>
    <filter id="pm-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Photo Card with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#pm-grad-primary)" filter="url(#pm-shadow)" />

  <!-- Inner Geometric Frame Overlay (Photo Mount) -->
  <rect x="68" y="68" width="376" height="376" rx="68" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Aperture Blades (Camera Lens Maze Theme) -->
  <g transform="translate(256, 230)" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4">
    <!-- Concentric Aperture Guide Rings -->
    <circle r="120" stroke-opacity="0.3" />
    <circle r="90" stroke-opacity="0.5" stroke-dasharray="8 6" />
    <!-- Golden Ratio Biometric Crop Marks -->
    <path d="M -110,-70 L -110,-100 L -80,-100" />
    <path d="M  110,-70 L  110,-100 L  80,-100" />
    <path d="M -110, 70 L -110, 100 L -80, 100" />
    <path d="M  110, 70 L  110, 100 L  80, 100" />
  </g>

  <!-- Biometric Portrait Silhouette (Centered & Proportional) -->
  <g transform="translate(256, 240)">
    <!-- Head Oval -->
    <circle cx="0" cy="-42" r="54" fill="#FFFFFF" />
    <!-- Neck -->
    <path d="M -18,12 L -18,34 L 18,34 L 18,12 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Torso / Shoulders with Arch -->
    <path d="M -92,108 C -92,54 -54,34 0,34 C 54,34 92,54 92,108 Z" fill="#FFFFFF" />
    <!-- Dynamic Aperture Ray / Flash Accent -->
    <circle cx="58" cy="-86" r="14" fill="#38BDF8" />
    <circle cx="78" cy="-66" r="7" fill="#67E8F9" />
  </g>

  <!-- Camera Lens Shutter Maze Notch Accent (Bottom center) -->
  <path d="M 226,410 L 256,388 L 286,410" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>

